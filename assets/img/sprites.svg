<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Logo -->
  <symbol id="dmail-logo" viewBox="0 0 100 100">
    <defs>
      <clipPath id="dClip">
        <path d="M50,78H16V100H55A20,25,0,0,0,55,0H16A11,11,0,0,0,16,22H50A22.5,27,0,0,1,50,78"/>
      </clipPath>
      <linearGradient id="blueGreen" gradientUnits="userSpaceOnUse" x1="50" y1="78" x2="66" y2="66">
        <stop offset="0%" stop-color="#328afb" />
        <stop offset="100%" stop-color="#15bd58" />
      </linearGradient>
      <linearGradient id="greenYellow" gradientUnits="userSpaceOnUse" x1="66" y1="66" x2="73" y2="50">
        <stop offset="0%" stop-color="#15bd58" />
        <stop offset="100%" stop-color="#f6c005" />
      </linearGradient>
      <linearGradient id="yellowOrange" gradientUnits="userSpaceOnUse" x1="73" y1="50" x2="65.5" y2="33.5">
        <stop offset="0%" stop-color="#f6c005" />
        <stop offset="100%" stop-color="#fc691c" />
      </linearGradient>
      <linearGradient id="orangeRed" gradientUnits="userSpaceOnUse" x1="65.5" y1="33.5" x2="50" y2="22">
        <stop offset="0%" stop-color="#fc691c" />
        <stop offset="100%" stop-color="#f93d35" />
      </linearGradient>
      <linearGradient id="redPink" gradientUnits="userSpaceOnUse" x1="50" y1="22" x2="16" y2="0">
        <stop offset="0%" stop-color="#f93d35" />
        <stop offset="100%" stop-color="#fd5d9a" />
      </linearGradient>
    </defs>
    <path d="M5 11H27V78H5V11" fill="#EA4335" />
    <g clip-path="url(#dClip)">
      <path d="M16,100H60L50,78H16V100" fill="#328afb" />
      <path d="M49,78L60,100L77,95L89,78L66.2,65.5L50,78" fill="url(#blueGreen)" />
      <path d="M89,78L95,60L95,50L73,50L66,66L88,78" fill="url(#greenYellow)" />
      <path d="M95,50L95,30L88.2,21L66.9,34L73,50L95,50" fill="url(#yellowOrange)" />
      <path d="M59,0L49,22L67,34L89,22L76,5L60,0" fill="url(#orangeRed)" />
      <path d="M60,0L50,22L5,22L5,0" fill="url(#redPink)" />
    </g>
    <path d="M5,78V89A11,11,0,0,0,27,89V78H5" fill="#EA4335" />
  </symbol>

  <!-- -Hamburger -->
